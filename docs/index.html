<!DOCTYPE html>
<html lang="th" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Overview — AI Quant Backtest Lab</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('cbot_quant_theme_v1');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&family=Noto+Sans+Thai:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/shell.css" />
  <link rel="stylesheet" href="assets/overview.css" />
</head>
<body data-page="index.html">
  <div id="app-shell"></div>

  <div id="page-main-template" hidden>
    <div class="overview-header-row">
      <h1 class="overview-h1">ระบบวิจัยและทดสอบบอทเทรดอัตโนมัติ (V5 Regime-Adaptive · Demo #5258778)</h1>
      <div class="overview-sync-meta">
        <span id="overview-last-refresh" class="mono">กำลังโหลด...</span>
        <button type="button" id="overview-manual-refresh" class="refresh-mini-btn" aria-label="รีเฟรชข้อมูลหน้า Overview ทันที">
          <span aria-hidden="true">↻</span>
          <span>Refresh</span>
        </button>
      </div>
    </div>

    <!-- V5 Core Loop: 4 Main Stages mapped onto 8-Page Portal -->
    <section class="v5-loop-card card" id="v5-4stage-loop" aria-label="วงจรพัฒนา 4 ขั้นตอนหลัก V5">
      <div style="padding:14px;color:var(--text-muted);">กำลังโหลด V5 4-Stage Pipeline...</div>
    </section>

    <!-- Row 1: Two Large Hero Cards (Live Demo vs Champion Backtest) -->
    <section class="hero-cards-grid" aria-label="เปรียบเทียบพอร์ตสดและผลการทดสอบย้อนหลัง">
      <article class="card hero-card hero-card-live" id="card-live-demo">
        <div style="padding:20px;color:var(--text-muted);">กำลังโหลดข้อมูล Live Demo...</div>
      </article>
      <article class="card hero-card hero-card-champion" id="card-champion-backtest">
        <div style="padding:20px;color:var(--text-muted);">กำลังโหลดข้อมูล Champion Backtest...</div>
      </article>
    </section>

    <!-- Row 2: Live Heartbeat - Trading Bots -->
    <section class="card bots-section-card" id="bots-heartbeat-section" aria-label="สถานะการทำงานของบอทสด">
      <div style="padding:16px;color:var(--text-muted);">กำลังโหลดสถานะบอท...</div>
    </section>

    <!-- Row 3: Alpha Funnel + Quick Access -->
    <section class="bottom-row-grid" aria-label="กรวยคัดกรองงานวิจัยและทางลัดเมนู">
      <article class="card funnel-card" id="card-alpha-funnel">
        <div style="padding:16px;color:var(--text-muted);">กำลังโหลด Alpha Funnel...</div>
      </article>
      <article class="card quick-card" id="card-quick-access">
        <div style="padding:16px;color:var(--text-muted);">กำลังโหลด Quick Access...</div>
      </article>
    </section>
  </div>

  <script type="module" src="assets/overview.js"></script>
</body>
</html>
