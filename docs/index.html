<!DOCTYPE html>
<html lang="th" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANTIGRAVITY QUANT · Visual Hub</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Noto+Sans+Thai:wght@400;600;700&family=JetBrains+Mono:wght@600;800&display=swap" rel="stylesheet">
<style>
  body{background:#060a12;color:#e2e8f0;font-family:'Plus Jakarta Sans','Noto Sans Thai',sans-serif}
  .mono{font-family:'JetBrains Mono',monospace}
  .bg-orbs{background:radial-gradient(900px 500px at 10% -10%,rgba(16,185,129,.14),transparent),radial-gradient(800px 500px at 100% 10%,rgba(56,189,248,.12),transparent)}
  .card{background:linear-gradient(160deg,#0f172a,#0a101c);border:1px solid #1e293b;border-radius:28px}
  .step{transition:.25s;cursor:pointer}.step:hover{transform:translateY(-6px) scale(1.04)}
  .glow-g{box-shadow:0 0 40px rgba(16,185,129,.35)}.glow-a{box-shadow:0 0 44px rgba(245,158,11,.5)}
  .glow-r{box-shadow:0 0 30px rgba(244,63,94,.5)}
  @keyframes pulse2{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
  .beat{animation:pulse2 1.4s infinite}
  .tile{transition:.2s}.tile:hover{transform:scale(1.08)}
  .ringtxt{font-family:'JetBrains Mono',monospace;font-weight:800}
  .flow{background:repeating-linear-gradient(90deg,#334155 0 10px,transparent 10px 20px);height:3px}
  #killbar{display:none}
</style>
</head>
<body class="bg-orbs min-h-screen">

<div id="killbar" class="bg-rose-600 text-white text-center font-extrabold py-2 text-sm tracking-widest">🚨 KILL SWITCH ON (จำลอง) · หยุดเปิดไม้ใหม่</div>

<!-- TOP BAR -->
<header class="sticky top-0 z-40 backdrop-blur bg-[#060a12]/85 border-b border-slate-800">
  <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
    <div class="flex items-center gap-3">
      <div class="text-3xl">🏛️</div>
      <div class="font-extrabold tracking-wider text-lg">ANTIGRAVITY <span class="text-emerald-400">QUANT</span></div>
    </div>
    <div class="flex items-center gap-3 sm:gap-5">
      <div class="flex items-center gap-2"><span id="liveDot" class="w-3 h-3 rounded-full bg-emerald-400 beat"></span><span id="liveCnt" class="mono font-extrabold text-emerald-300">3</span><span>🤖</span></div>
      <div class="mono font-extrabold text-xl text-white" id="eq">$97.48</div>
      <button onclick="toggleKill()" class="px-4 py-2 rounded-2xl bg-gradient-to-r from-rose-600 to-red-700 font-extrabold text-sm glow-r">🛑 KILL</button>
    </div>
  </div>
  <nav class="max-w-7xl mx-auto px-4 pb-2 flex gap-2 overflow-x-auto text-sm">
    <a href="#flow" class="px-3 py-1 rounded-full bg-slate-800 whitespace-nowrap">🗺️</a>
    <a href="#score" class="px-3 py-1 rounded-full bg-slate-800 whitespace-nowrap">🎯</a>
    <a href="#live" class="px-3 py-1 rounded-full bg-slate-800 whitespace-nowrap">🔴</a>
    <a href="#engines" class="px-3 py-1 rounded-full bg-slate-800 whitespace-nowrap">🏆</a>
    <a href="pro.html" class="px-3 py-1 rounded-full bg-cyan-600/30 border border-cyan-500/40 whitespace-nowrap">🕯️ กราฟรายไม้</a>
    <a href="research.html" class="px-3 py-1 rounded-full bg-purple-600/30 border border-purple-500/40 whitespace-nowrap">📚 141</a>
    <a href="chat_transcript.html" class="px-3 py-1 rounded-full bg-slate-800 whitespace-nowrap">💬</a>
  </nav>
</header>

<main class="max-w-7xl mx-auto px-4 py-6 space-y-8">

<!-- 1. FLOW -->
<section id="flow" class="card p-5 sm:p-8">
  <div class="grid grid-cols-5 gap-2 sm:gap-4 items-center text-center" id="flowRow"></div>
  <div class="hidden sm:block flow mt-[-92px] mb-[70px] mx-16 opacity-60"></div>
  <div id="stepInfo" class="mt-6 text-center text-lg font-bold text-slate-300 min-h-[28px]"></div>
</section>

<!-- 2. SCORE -->
<section id="score" class="grid grid-cols-2 lg:grid-cols-4 gap-4" >
  <div class="card p-5 text-center"><div id="r_dd"></div><div class="text-3xl mt-1">📉</div></div>
  <div class="card p-5 text-center"><div id="r_pf"></div><div class="text-3xl mt-1">💹</div></div>
  <div class="card p-5 text-center"><div id="r_wf"></div><div class="text-3xl mt-1">📅</div></div>
  <div class="card p-5 text-center"><div id="r_ruin"></div><div class="text-3xl mt-1">🎲</div></div>
</section>

<section class="grid lg:grid-cols-2 gap-4">
  <div class="card p-5">
    <div class="flex items-center justify-between mb-3"><div class="text-2xl">✅ <span class="mono text-emerald-400 font-extrabold" id="chkCnt">9/9</span></div><div class="text-2xl">🛡️</div></div>
    <div id="chk" class="grid grid-cols-3 gap-3"></div>
  </div>
  <div class="card p-5">
    <div class="flex items-center justify-between mb-3"><div class="text-2xl">📅 2022 → 2026</div><div class="text-2xl">🥇</div></div>
    <div id="wf" class="flex items-end justify-between gap-3 h-52 px-2"></div>
  </div>
</section>

<!-- IS VAL OOS -->
<section class="card p-5">
  <div class="grid grid-cols-3 gap-3 text-center" id="split"></div>
</section>

<!-- 3. LIVE -->
<section id="live" class="space-y-4">
  <div class="flex items-center gap-3 text-2xl font-extrabold"><span class="w-4 h-4 rounded-full bg-rose-500 beat"></span>LIVE <span class="text-sm mono text-slate-500">#5258778</span></div>
  <div id="bots" class="grid sm:grid-cols-2 lg:grid-cols-4 gap-4"></div>
  <div class="card p-5">
    <div class="flex items-center justify-between mb-2"><div class="text-2xl">💰</div><div class="mono text-sm text-slate-400" id="spkLbl"></div></div>
    <svg id="spark" viewBox="0 0 600 120" class="w-full h-32"></svg>
    <div id="trades" class="flex flex-wrap gap-2 mt-3"></div>
  </div>
</section>

<!-- 4. ENGINES -->
<section id="engines" class="card p-5 sm:p-8">
  <div class="flex items-center justify-between mb-4">
    <div class="text-2xl font-extrabold">🏆 13 ENGINES</div>
    <div class="flex gap-2" id="engTabs"></div>
  </div>
  <div id="engBars" class="space-y-2"></div>
</section>

<!-- 5. PAPERS -->
<section class="grid grid-cols-2 lg:grid-cols-4 gap-4 text-center">
  <a href="research.html" class="card p-6 hover:border-purple-500 transition"><div class="text-6xl font-extrabold mono text-purple-400">141</div><div class="text-4xl mt-2">📚</div></a>
  <a href="research.html" class="card p-6 hover:border-cyan-500 transition"><div class="text-6xl font-extrabold mono text-cyan-400">13</div><div class="text-4xl mt-2">⚙️</div></a>
  <a href="pro.html" class="card p-6 hover:border-amber-500 transition"><div class="text-6xl">🕯️</div><div class="text-sm mt-3 text-slate-400">REPLAY</div></a>
  <a href="legacy.html" class="card p-6 hover:border-emerald-500 transition"><div class="text-6xl font-extrabold mono text-emerald-400">2K+</div><div class="text-4xl mt-2">🗄️</div></a>
</section>

<div class="text-center text-xs text-slate-600 pb-6">
  <a href="pro.html" class="underline">รายละเอียดเต็ม</a> · 🔄 <span id="clock" class="mono"></span>
</div>
</main>

<!-- MODAL -->
<div id="modal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur flex items-center justify-center p-4" onclick="if(event.target===this)closeModal()">
  <div class="card max-w-md w-full p-6 text-center border-amber-500/60">
    <div class="text-6xl mb-2" id="mIcon">👤</div>
    <div class="text-xl font-extrabold mb-3" id="mTitle"></div>
    <pre id="mCmd" class="mono text-emerald-400 text-xs bg-black/50 rounded-2xl p-3 text-left whitespace-pre-wrap"></pre>
    <div class="flex gap-3 mt-4 justify-center">
      <button onclick="copyCmd()" class="px-5 py-3 rounded-2xl bg-emerald-500 text-slate-950 font-extrabold text-lg" id="mCopy">📋</button>
      <button onclick="closeModal()" class="px-5 py-3 rounded-2xl bg-slate-800 font-extrabold text-lg">✕</button>
    </div>
  </div>
</div>

<script>
// ---------- DEFAULT DATA (overridden by data/*.json) ----------
let V2 = {
  full_period_metrics:{profit_factor:1.16,max_dd_pct:13.84,net_pnl_usd:7.73,trades:109},
  in_sample_metrics:{profit_factor:1.22,net_pnl_usd:6.62,trades:68},
  validation_metrics:{profit_factor:0.23,net_pnl_usd:-4.0,trades:9},
  out_of_sample_metrics:{profit_factor:1.37,net_pnl_usd:5.11,trades:32},
  validation_stats_report:{walk_forward:{windows:{
    "2022":{net_pnl_usd:3.94},"2023":{net_pnl_usd:-2.26},"2024":{net_pnl_usd:3.43},"2025":{net_pnl_usd:1.96},"2026":{net_pnl_usd:0.66}},
    profitable_windows:4,total_windows:5},monte_carlo:{ruin_probability_pct:0.0}},
  validation_checklist:{has_hard_stop_loss:true,risk_per_trade_within_limit:true,max_dd_within_limit:true,pf_above_minimum:true,oos_profitable:true,walk_forward_passed:true,monte_carlo_passed:true,no_lookahead_bias_verified:true,ai_security_audit_passed:true}
};
const CHK=[["has_hard_stop_loss","🛑","Stop Loss"],["risk_per_trade_within_limit","⚖️","Risk/Trade"],["max_dd_within_limit","📉","Max DD"],["pf_above_minimum","💹","PF"],["oos_profitable","🧪","Out-of-Sample"],["walk_forward_passed","📅","Walk-Forward"],["monte_carlo_passed","🎲","Monte Carlo"],["no_lookahead_bias_verified","🔍","No Lookahead"],["ai_security_audit_passed","🔒","Code Audit"]];
const ENG={
 BTCUSD:[["KELLY",5.82],["ROUGH_VOL",4.38],["DEEPLOB",3.38],["VWAP",3.02],["NEWS_GATE",2.22],["LEAD_LAG",0.56],["HMM",-0.10],["GOLD_INTRA",-0.20],["OFI",-0.62],["KALMAN",-0.62],["MASTER",-0.63],["HAWKES",-3.23],["AVELLANEDA",-6.38]],
 ETHUSD:[["DOM_ABS",16.16],["NEWS_GATE",0.20],["KELLY",-0.18],["LEAD_LAG",-0.35],["DEEPLOB",-1.16]],
 "GOLD-PERP":[["QF_V2 (1oz)",61.63],["SMART_RUNNER",14.18],["SMC_FIBO",5.75],["DOM_FADE",5.35]]
};
let bots=[],trades=[],engSym="BTCUSD",killOn=false,curCmd="";

// ---------- HELPERS ----------
const $=id=>document.getElementById(id);
function ring(pct,color,big,small){
  const R=52,C=2*Math.PI*R,off=C*(1-Math.min(1,Math.max(0,pct)));
  return `<svg viewBox="0 0 140 140" class="w-full max-w-[170px] mx-auto"><circle cx="70" cy="70" r="${R}" stroke="#1e293b" stroke-width="14" fill="none"/>
  <circle cx="70" cy="70" r="${R}" stroke="${color}" stroke-width="14" fill="none" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}" transform="rotate(-90 70 70)"/>
  <text x="70" y="74" text-anchor="middle" class="ringtxt" fill="#fff" font-size="24">${big}</text>
  <text x="70" y="94" text-anchor="middle" class="ringtxt" fill="#64748b" font-size="10">${small}</text></svg>`;
}

// ---------- FLOW ----------
const STEPS=[
 {i:"📚",c:"#a855f7",t:"141",s:"ok",info:"141 เปเปอร์ → 13 เอนจิน"},
 {i:"🤖",c:"#22d3ee",t:"AI",s:"ok",info:"CEO + Worker เขียนโค้ด (แก้ 1 รอบ)"},
 {i:"🧮",c:"#10b981",t:"9/9",s:"ok",info:"คณิตศาสตร์ 5 ปี ผ่านครบ 9 ข้อ"},
 {i:"👤",c:"#f59e0b",t:"?",s:"wait",info:"รอคุณกดอนุมัติ Paper Trading"},
 {i:"📈",c:"#f43f5e",t:"LIVE",s:"run",info:"บอทเทรดสดบน Demo"}
];
function renderFlow(){
  $("flowRow").innerHTML=STEPS.map((s,k)=>`
   <div class="step text-center" onclick="stepClick(${k})">
     <div class="mx-auto w-16 h-16 sm:w-24 sm:h-24 rounded-full flex items-center justify-center text-3xl sm:text-5xl ${s.s==='wait'?'glow-a beat':s.s==='ok'?'glow-g':''}" style="background:${s.c}22;border:3px solid ${s.c}">${s.i}</div>
     <div class="mt-2 mono font-extrabold text-sm sm:text-lg" style="color:${s.c}">${s.t}</div>
     <div class="text-lg">${s.s==='ok'?'✅':s.s==='wait'?'⏳':'🟢'}</div>
   </div>`).join("");
  $("stepInfo").textContent=STEPS[3].info;
}
function stepClick(k){
  $("stepInfo").textContent=STEPS[k].info;
  if(k===3){openModal("👤","APPROVE → PAPER","Set-Location \"d:\\cbot-atgvt\"\npython -m quant_fund_v2.run_v2 --symbol XAUUSD --approve-paper");}
  if(k===0) location.href="research.html";
  if(k===4) document.getElementById("live").scrollIntoView({behavior:"smooth"});
  if(k===2) document.getElementById("score").scrollIntoView({behavior:"smooth"});
}

// ---------- SCORE ----------
function renderScore(){
  const f=V2.full_period_metrics,wf=V2.validation_stats_report.walk_forward,mc=V2.validation_stats_report.monte_carlo;
  $("r_dd").innerHTML=ring(f.max_dd_pct/18,"#f59e0b",f.max_dd_pct.toFixed(1)+"%","MAX 18%");
  $("r_pf").innerHTML=ring(Math.min(f.profit_factor/2,1),"#10b981",f.profit_factor.toFixed(2),"PF ≥ 1.15");
  $("r_wf").innerHTML=ring(wf.profitable_windows/wf.total_windows,"#22d3ee",wf.profitable_windows+"/"+wf.total_windows,"YEARS");
  $("r_ruin").innerHTML=ring(Math.max(0.02,mc.ruin_probability_pct/1),"#10b981",mc.ruin_probability_pct.toFixed(1)+"%","RUIN");
  // checklist
  const chk=V2.validation_checklist;let ok=0;
  $("chk").innerHTML=CHK.map(([k,ic,n])=>{const p=chk[k]!==false;if(p)ok++;
    return `<div class="tile rounded-2xl p-3 text-center ${p?'bg-emerald-500/10 border-emerald-500/40':'bg-rose-500/15 border-rose-500/60'} border" title="${n}">
    <div class="text-3xl">${ic}</div><div class="text-xl">${p?'✅':'❌'}</div><div class="text-[10px] text-slate-400">${n}</div></div>`}).join("");
  $("chkCnt").textContent=ok+"/9";
  // walk-forward bars
  const w=wf.windows,ys=Object.keys(w),mx=Math.max(...ys.map(y=>Math.abs(w[y].net_pnl_usd)),1);
  $("wf").innerHTML=ys.map(y=>{const v=w[y].net_pnl_usd,h=Math.max(14,Math.abs(v)/mx*140),pos=v>=0;
    return `<div class="flex-1 text-center"><div class="mono text-sm font-extrabold ${pos?'text-emerald-400':'text-rose-400'}">${pos?'+':''}${v.toFixed(1)}</div>
    <div class="mx-auto w-full max-w-[56px] rounded-t-2xl ${pos?'bg-gradient-to-t from-emerald-700 to-emerald-400':'bg-gradient-to-t from-rose-800 to-rose-500'}" style="height:${h}px"></div>
    <div class="mono text-xs text-slate-400 mt-1">${y.slice(2)}</div></div>`}).join("");
  // split
  const sp=[["🏋️",V2.in_sample_metrics,"IN"],["🔬",V2.validation_metrics,"VAL"],["🚀",V2.out_of_sample_metrics,"OOS"]];
  $("split").innerHTML=sp.map(([ic,m,l])=>{const good=m.profit_factor>=1;
    return `<div class="rounded-2xl p-4 border ${good?'border-emerald-500/40 bg-emerald-500/5':'border-rose-500/40 bg-rose-500/5'}">
    <div class="text-4xl">${ic}</div><div class="mono text-xs text-slate-400 mt-1">${l}</div>
    <div class="mono text-3xl font-extrabold ${good?'text-emerald-400':'text-rose-400'}">${m.profit_factor.toFixed(2)}</div>
    <div class="mono text-sm ${m.net_pnl_usd>=0?'text-emerald-300':'text-rose-300'}">${m.net_pnl_usd>=0?'+':''}$${m.net_pnl_usd.toFixed(2)}</div></div>`}).join("");
}

// ---------- LIVE ----------
function renderBots(){
  $("bots").innerHTML=bots.map(b=>{
    const on=b.is_online,imb=b.imbalance||0,bid=Math.max(10,Math.min(90,Math.round(50+imb*450)));
    return `<div class="card p-4 ${on?'border-emerald-500/40':'opacity-50'}">
      <div class="flex items-center justify-between"><div class="text-4xl">${b.icon||'🤖'}</div><span class="w-3 h-3 rounded-full ${on?'bg-emerald-400 beat':'bg-rose-500'}"></span></div>
      <div class="mono font-extrabold mt-1">${b.symbol}</div>
      ${on?`<div class="mono text-2xl font-extrabold text-emerald-400">${(b.current_price||0).toLocaleString(undefined,{maximumFractionDigits:2})}</div>
      <div class="w-full h-3 rounded-full overflow-hidden flex mt-2 bg-slate-900"><div class="bg-emerald-500" style="width:${bid}%"></div><div class="bg-rose-500" style="width:${100-bid}%"></div></div>
      <div class="flex justify-between text-[10px] mono text-slate-500 mt-1"><span>🟢 ${bid}</span><span>${100-bid} 🔴</span></div>`
      :`<div class="text-3xl mt-2">⏸️</div>`}
    </div>`}).join("");
}
function renderSpark(){
  const bal=trades.filter(t=>t.balance&&!isNaN(parseFloat(t.balance))).map(t=>parseFloat(t.balance));
  const svg=$("spark");
  if(bal.length<2){svg.innerHTML="";return}
  const mn=Math.min(...bal)-.3,mx=Math.max(...bal)+.3,x=i=>10+i*(580/(bal.length-1)),y=v=>110-(v-mn)/(mx-mn)*100;
  const d=bal.map((v,i)=>(i?'L':'M')+x(i)+','+y(v)).join(' ');
  const up=bal[bal.length-1]>=bal[0],c=up?'#10b981':'#f43f5e';
  svg.innerHTML=`<path d="${d} L590,115 L10,115Z" fill="${c}22"/><path d="${d}" stroke="${c}" stroke-width="3" fill="none"/><circle cx="${x(bal.length-1)}" cy="${y(bal[bal.length-1])}" r="5" fill="${c}"/>`;
  $("spkLbl").textContent="$"+bal[0].toFixed(2)+" → $"+bal[bal.length-1].toFixed(2);
  $("trades").innerHTML=trades.filter(t=>t.event==="CLOSE").slice(-14).map(t=>{const n=parseFloat(t.net||0);
    return `<span class="px-2 py-1 rounded-xl mono text-xs font-extrabold ${n>=0?'bg-emerald-500/20 text-emerald-300':'bg-rose-500/20 text-rose-300'}">${n>=0?'▲':'▼'} ${Math.abs(n).toFixed(2)}</span>`}).join("");
}
async function pollLive(){
  try{
    const r=await fetch("data/live_status.json?t="+Date.now());if(!r.ok)return;const d=await r.json();
    if(d.forward_trading)$("eq").textContent="$"+d.forward_trading.equity.toFixed(2);
    if(d.summary)$("liveCnt").textContent=d.summary.forward_online;
    if(d.bots_fleet){bots=d.bots_fleet;renderBots()}
    if(d.recent_trades){trades=d.recent_trades;renderSpark()}
    $("clock").textContent=d.timestamp_local||"";
  }catch(e){}
}
async function loadV2(){
  try{const r=await fetch("data/quant_fund_v2_status.json?t="+Date.now());if(r.ok){V2=await r.json();renderScore()}}catch(e){}
}

// ---------- ENGINES ----------
function renderEng(){
  $("engTabs").innerHTML=Object.keys(ENG).map(s=>`<button onclick="engSym='${s}';renderEng()" class="px-3 py-1 rounded-full text-xs font-extrabold mono ${s===engSym?'bg-amber-500 text-slate-950':'bg-slate-800 text-slate-300'}">${s}</button>`).join("");
  const rows=ENG[engSym],mx=Math.max(...rows.map(r=>Math.abs(r[1])));
  $("engBars").innerHTML=rows.map(([n,v])=>{const w=Math.max(3,Math.abs(v)/mx*50),pos=v>=0;
    return `<div class="flex items-center gap-2 text-xs mono"><div class="w-28 sm:w-36 text-right text-slate-400 truncate">${n}</div>
    <div class="flex-1 flex items-center h-6"><div class="w-1/2 flex justify-end">${pos?'':`<div class="h-5 rounded-l-full bg-gradient-to-l from-rose-500 to-rose-800" style="width:${w*2}%"></div>`}</div>
    <div class="w-1/2">${pos?`<div class="h-5 rounded-r-full bg-gradient-to-r from-emerald-500 to-emerald-300" style="width:${w*2}%"></div>`:''}</div></div>
    <div class="w-14 font-extrabold ${pos?'text-emerald-400':'text-rose-400'}">${pos?'+':''}${v.toFixed(2)}</div></div>`}).join("");
}

// ---------- MODAL / KILL ----------
function openModal(i,t,c){curCmd=c;$("mIcon").textContent=i;$("mTitle").textContent=t;$("mCmd").textContent=c;$("modal").classList.remove("hidden")}
function closeModal(){$("modal").classList.add("hidden")}
function copyCmd(){navigator.clipboard.writeText(curCmd);$("mCopy").textContent="✅";setTimeout(()=>$("mCopy").textContent="📋",1500)}
function toggleKill(){killOn=!killOn;$("killbar").style.display=killOn?"block":"none"}

// ---------- INIT ----------
renderFlow();renderScore();renderEng();
pollLive();loadV2();setInterval(pollLive,3000);
</script>
</body>
</html>
